<VirtualHost *:8080>
    ServerName 127.0.0.1
    DocumentRoot /opt/ai6/public

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

    <Directory /opt/ai6/public>
        AllowOverride None
        Options -Indexes +FollowSymLinks
        Require all granted
        FallbackResource /index.php
    </Directory>
</VirtualHost>

