        "timeout": "5s",
        "retries": 6,
        "start_period": "10s"
      },
      "restart": "unless-stopped"
    },
    "init": {
      "image": "ai6-runtime:php-8.5.5_sqlite-3.53.4",
      "build": { "context": ".", "dockerfile": "Dockerfile" },
      "command": ["init"],
      "user": "0:0",
      "read_only": true,
      "environment": {
        "AI6_RUNTIME_ROLE": "init",
        "AI6_MANAGED_PROJECT_ROOT": "/var/lib/ai6/managed",
        "AI6_EFFECT_LOCK_DIRECTORY": "/var/lib/ai6/managed/effect-locks",
        "AI6_EFFECT_LOCK_OBJECT_COUNT": "${AI6_EFFECT_LOCK_OBJECT_COUNT:-64}",
        "AI6_EFFECT_LOCK_OWNER_UID": "${AI6_EFFECT_LOCK_OWNER_UID:-0}",
