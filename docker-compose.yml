    }
  },
  "volumes": {
    "ai6_database": {},
    "ai6_storage": {},
    "ai6_executions": {},
    "ai6_agent_executions": {
      "driver_opts": { "type": "tmpfs", "device": "tmpfs", "o": "uid=10001,gid=10001,mode=0750,nosuid,nodev,noexec" }
