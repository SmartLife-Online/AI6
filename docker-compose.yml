        "APP_ENV": "production",
        "APP_KEY": "${APP_KEY:-}",
        "APP_NAME": "${APP_NAME:-AI6}",
        "APP_URL": "http://localhost:${AI6_HTTP_PORT:-8080}",
        "CACHE_STORE": "file",
        "DB_BUSY_TIMEOUT": "${DB_BUSY_TIMEOUT:-5000}",
        "DB_CONNECTION": "sqlite",
        "DB_DATABASE": "/var/lib/ai6/database/database.sqlite",
        "DB_FOREIGN_KEYS": "true",
        "DB_JOURNAL_MODE": "WAL",
        "DB_SYNCHRONOUS": "NORMAL",
        "LOG_CHANNEL": "stderr",
        "QUEUE_CONNECTION": "database",
        "SESSION_DRIVER": "database"
