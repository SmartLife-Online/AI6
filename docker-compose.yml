        "AI6_AUTH_STEP_UP_WINDOW_SECONDS": "${AI6_AUTH_STEP_UP_WINDOW_SECONDS:-300}",
        "AI6_HTTP_SESSION_SAME_SITE": "${AI6_HTTP_SESSION_SAME_SITE:-lax}",
        "AI6_HTTP_TRUSTED_HOSTS": "${AI6_HTTP_TRUSTED_HOSTS:-localhost,127.0.0.1,::1}",
        "AI6_HTTP_TRUSTED_PROXIES": "${AI6_HTTP_TRUSTED_PROXIES:-172.30.61.2}",
        "AI6_LOGIN_CONFIRMATION_EMAIL": "${AI6_LOGIN_CONFIRMATION_EMAIL:-}",
        "AI6_REDACTION_ACTIVE_KEY_ID": "${AI6_REDACTION_ACTIVE_KEY_ID:-app-key-v1}",
        "AI6_REDACTION_KEYS": "${AI6_REDACTION_KEYS:-}",
        "AI6_RUNTIME_ROLE": "app",
        "AI6_GIT_ALLOWED_HOSTS": "${AI6_GIT_ALLOWED_HOSTS:-}",
        "AI6_GIT_ALLOWED_REMOTE_PATHS": "${AI6_GIT_ALLOWED_REMOTE_PATHS:-}",
        "AI6_GIT_ALLOWED_REF_PATTERNS": "${AI6_GIT_ALLOWED_REF_PATTERNS:-refs/heads/*}",
        "AI6_GIT_PINNED_HOST_KEYS": "${AI6_GIT_PINNED_HOST_KEYS:-}",
        "AI6_CONTROL_OPERATION_HEARTBEAT_SECONDS": "${AI6_CONTROL_OPERATION_HEARTBEAT_SECONDS:-30}",
        "AI6_CONTROL_OPERATION_LEASE_SECONDS": "${AI6_CONTROL_OPERATION_LEASE_SECONDS:-120}",
        "AI6_CONTROL_OPERATION_MANAGED_REF_ALLOWLIST": "${AI6_CONTROL_OPERATION_MANAGED_REF_ALLOWLIST:-refs/heads/main}",
        "AI6_CONTROL_OPERATION_STALE_SECONDS": "${AI6_CONTROL_OPERATION_STALE_SECONDS:-300}",
        "AI6_SECURITY_ACKNOWLEDGE_REDUCED_MODE": "${AI6_SECURITY_ACKNOWLEDGE_REDUCED_MODE:-false}",
        "AI6_SECURITY_LOGIN_EMAIL_CONFIRMATION": "${AI6_SECURITY_LOGIN_EMAIL_CONFIRMATION:-true}",
        "AI6_SECURITY_PROFILE": "${AI6_SECURITY_PROFILE:-strict}",
        "AI6_SECURITY_REQUIRE_AGENT_SANDBOX": "${AI6_SECURITY_REQUIRE_AGENT_SANDBOX:-true}",
