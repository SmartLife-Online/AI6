      ],
      "healthcheck": {
        "test": ["CMD", "/opt/ai6/docker/healthcheck.sh", "app"],
        "interval": "10s",
        "timeout": "5s",
        "retries": 6,
        "start_period": "15s"
      },
      "restart": "unless-stopped"
