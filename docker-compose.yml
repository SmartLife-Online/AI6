        "app": { "condition": "service_healthy" }
      },
      "ports": ["127.0.0.1:${AI6_HTTP_PORT:-8080}:8080"],
      "networks": { "proxy": { "ipv4_address": "${AI6_PROXY_ADDRESS:-172.30.61.2}" } },
