        "AI6_SECURITY_LOGIN_EMAIL_CONFIRMATION": "${AI6_SECURITY_LOGIN_EMAIL_CONFIRMATION:-true}",
        "AI6_SECURITY_PROFILE": "${AI6_SECURITY_PROFILE:-strict}",
        "AI6_SECURITY_REQUIRE_AGENT_SANDBOX": "${AI6_SECURITY_REQUIRE_AGENT_SANDBOX:-true}",
        "AI6_SECURITY_REQUIRE_CHECKER_NETWORK_ISOLATION": "${AI6_SECURITY_REQUIRE_CHECKER_NETWORK_ISOLATION:-true}",
        "AI6_SECURITY_REQUIRE_CRITICAL_ACTION_STEP_UP": "${AI6_SECURITY_REQUIRE_CRITICAL_ACTION_STEP_UP:-true}",
        "AI6_SECURITY_REQUIRE_HTTPS_OR_PRIVATE_ACCESS": "${AI6_SECURITY_REQUIRE_HTTPS_OR_PRIVATE_ACCESS:-true}",
        "AI6_SECURITY_REQUIRE_LLM_PRECOMMIT_REVIEW": "${AI6_SECURITY_REQUIRE_LLM_PRECOMMIT_REVIEW:-true}",
        "AI6_SECURITY_REQUIRE_PRIVILEGED_PASSKEY": "${AI6_SECURITY_REQUIRE_PRIVILEGED_PASSKEY:-true}",
        "APP_DEBUG": "false",
        "APP_ENV": "production",
        "DB_BUSY_TIMEOUT": "${DB_BUSY_TIMEOUT:-5000}",
        "DB_CONNECTION": "sqlite",
        "DB_DATABASE": "/var/lib/ai6/database/database.sqlite",
        "DB_FOREIGN_KEYS": "true",
        "DB_JOURNAL_MODE": "WAL",
        "DB_SYNCHRONOUS": "NORMAL"
