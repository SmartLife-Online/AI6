      "volumes": [
        { "type": "volume", "source": "ai6_database", "target": "/var/lib/ai6/database" },
        { "type": "volume", "source": "ai6_storage", "target": "/opt/ai6/storage" },
        { "type": "volume", "source": "ai6_managed", "target": "/var/lib/ai6/managed" },
        { "type": "tmpfs", "target": "/tmp", "tmpfs": { "mode": 1023, "size": 67108864 } }
      ],
      "restart": "no"
    },
    "app": {
      "image": "ai6-runtime:php-8.5.5_sqlite-3.53.4",
      "build": { "context": ".", "dockerfile": "Dockerfile" },
      "command": ["app"],
      "depends_on": { "init": { "condition": "service_completed_successfully" } },
      "read_only": true,
      "networks": { "default": {}, "proxy": {} },
