        { "type": "volume", "source": "ai6_checker_workspace", "target": "/var/lib/ai6/checker-workspace" },
        { "type": "tmpfs", "target": "/run/ai6/heartbeat/checker", "tmpfs": { "mode": 511, "size": 1048576 } },
        { "type": "tmpfs", "target": "/tmp", "tmpfs": { "mode": 1023, "size": 67108864 } }
      ],
      "healthcheck": {
        "test": ["CMD", "/opt/ai6/docker/healthcheck.sh", "checker"],
        "interval": "10s",
        "timeout": "5s",
        "retries": 6,
        "start_period": "10s"
      },
      "restart": "unless-stopped"
    }
  },
  "networks": {
    "default": {
      "ipam": { "config": [{ "subnet": "${AI6_SERVICE_SUBNET:-172.30.60.0/24}", "ip_range": "${AI6_SERVICE_IP_RANGE:-172.30.60.128/25}" }] }
